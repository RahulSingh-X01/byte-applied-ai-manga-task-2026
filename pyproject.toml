[project]
name = "manga-task"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "peft>=0.21.2",
    "pillow>=12.3.0",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.17.0",
    "trl>=1.15.0",
]

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
